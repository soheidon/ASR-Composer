[package]
name = "asr-composer"
version = "0.5.0"
edition = "2021"

[lib]
name = "asr_composer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["process", "time", "io-util", "net", "sync", "macros"] }
base64 = "0.22.1"
uuid = { version = "1", features = ["v4"] }
directories = "5"
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = "9"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Credentials"] }

